name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check juniper1 tests scripts
      - name: Package tests (tokenizer, numerics, generation; no download)
        run: python -m pytest -q tests -p no:cacheprovider
  training-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.1.2' 'pytest==9.1.1' 'pyarrow==25.0.1' 'tokenizers==0.23.2'
      - name: Training-loop, checkpoint and resume tests (CPU, synthetic data)
        working-directory: training
        env:
          OMP_NUM_THREADS: '2'
        run: python -m pytest -q tests -p no:cacheprovider
