# Established large corpora evaluated as alternative raw material (2026-10-07).

[[considered]]
source_id = "dclm-baseline"
origin = "https://huggingface.co/datasets/mlfoundations/dclm-baseline-1.0"
revision = "a3b142c183aebe5af344955ae20836eb34dcf69b"
state = "TRAINING_ONLY_NO_REDISTRIBUTION"
reason = "Strong general-web alternative (fastText quality classifier, ~4T tokens; CC-BY-4.0 on the compilation plus Common Crawl ToU). Not acquired in v0.1: FineWeb-Edu plus FineMath already supply the educational and STEM web foundation the design asks for at the target size, DCLM performs no PII anonymization and no decontamination, and adding it would duplicate much of the same crawl. Candidate for general-domain breadth in a later version once pilot domain losses are measured."
evidence = ["https://huggingface.co/datasets/mlfoundations/dclm-baseline-1.0", "https://arxiv.org/abs/2406.11794"]

[[considered]]
source_id = "dolma-v1_7"
origin = "https://huggingface.co/datasets/allenai/dolma"
revision = "7f48140530a023e9ea4c5cfb141160922727d4d3"
state = "REVIEW_REQUIRED"
reason = "ODC-By compilation of heterogeneous subsets (Common Crawl, C4, Reddit, Gutenberg, Stack-derived code, peS2o, arXiv, Wikipedia) whose underlying terms differ per subset; the code inherits The Stack's terms and Reddit adds user-content PII risk. Every subset Juniper needs is covered by an individually licensed, better-filtered dataset already admitted."
evidence = ["https://huggingface.co/datasets/allenai/dolma", "https://arxiv.org/abs/2402.00159"]

