# Explicit owner gates for training use of the Juniper 1 base corpus.
# PENDING means corpus engineering and measurement may be reviewed, but training
# authorization is not established. Only the project owner may change these.
#
# 2026-10-08: Markus Gillyard approved all four [[decision]] records for TRAINING
# INPUT (tokenizer training and pretraining) in a Claude Code session, answering
# a question that stated each source's pinned identity, share of accepted bytes,
# and the evidence brief docs/owner_decision_brief_v0.3.md. The approval does not
# cover redistribution of source text or the license treatment of released
# weights; those are the separate [[release_decision]] records below.

[[decision]]
decision_id = "fineweb-edu-training-use"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["fineweb-edu-dedup"]
question = "For the pinned FineWeb-Edu-derived subset, approve or reject use as Juniper 1 training input after reviewing the ODC-By database grant, Common Crawl Terms of Use (including their AI/ML indemnity), and underlying page rights. Record future weight-distribution treatment separately."

[[decision]]
decision_id = "finemath-training-use"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["finemath-4plus"]
question = "For the pinned FineMath-4+ subset, approve or reject use as Juniper 1 training input after reviewing the ODC-By database grant, Common Crawl Terms of Use (including their AI/ML indemnity), and underlying page rights. Record future weight-distribution treatment separately."

[[decision]]
decision_id = "cc-by-sa-training-and-weights-treatment"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["wikimedia", "stackexchange", "arxiv-papers", "libretexts", "pressbooks", "oercommons"]
question = "For documents carrying CC BY-SA 2.5, 3.0, or 4.0 across the listed sources, choose to exclude them from a new training corpus identity or retain them only after legal review records the training basis, attribution, and treatment of any publicly distributed weights under the intended Apache-2.0 project license. Do not assume the weights are or are not adaptations."

[[decision]]
decision_id = "stackv2-license-and-provenance"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["stackv2-edu"]
question = "For the pinned Common Pile Stack v2 educational release, choose to exclude it or retain it after reviewing repository-level automated license detection, known misclassification risk, Software Heritage principles and opt-outs, the June 2025 release date versus later Stack v2 removals, and whether separate BigCode bulk-access terms apply to this derivative. Record training and distribution treatment separately."

# Release treatment is decided separately from training use and does not gate
# corpus engineering or training. It must be resolved before public weights ship.

[[release_decision]]
decision_id = "weights-release-license-treatment"
status = "PENDING"
question = "Before a public Apache-2.0 weight release, record the treatment of weights trained on FineWeb-Edu and FineMath (ODC-By section 4.3 notice), CC BY-SA documents (ShareAlike and attribution), and Stack v2 code (provenance, opt-outs), with model-card disclosure."

[[release_decision]]
decision_id = "dataset-redistribution"
status = "PENDING"
question = "The training corpus stays private. Any redistribution of corpus text, shards, or derived token IDs needs a source-by-source decision."

# 2026-10-16: the owner (Markus Gillyard) directed, in writing, that Juniper 1 Base be published on GitHub
# and Hugging Face under Apache-2.0 for the Cinqic-owned weights, code, tokenizer and documentation
# "wherever Cinqic has the rights to do so", and that the dataset and reproducibility materials be
# published "to the fullest extent permitted by the actual source terms". The two PENDING records above are
# preserved unchanged as the questions that were asked; the records below are the owner's answers as given
# in that directive, applied source by source through the rights analysis in
# docs/release/rights_table_2026-10-16.md (Claude Fable 5.1, recorded 2026-10-16). The directive supplies
# owner authorization; it does not alter third-party terms.

[[release_decision]]
decision_id = "weights-release-license-treatment-2026-10-16"
resolves = "weights-release-license-treatment"
status = "DECIDED"
decided_by = "Markus Gillyard (owner directive of 2026-10-16, recorded by Claude Fable 5.1)"
decided_at = "2026-10-16"
treatment = "Juniper 1 Base weights (juniper1-base-v1) are released under Apache-2.0 as Cinqic's own work. The release NOTICE carries the ODC-By 1.0 section 4.3 notice for FineWeb-Edu and FineMath, discloses the CC BY-SA sources (Wikimedia, Stack Exchange, and the CC BY-SA documents in the textbook and arXiv sources) with preserved per-document attribution, discloses the permissively licensed Stack v2 Edu code with its notice obligations, cites the Common Pile, and states that the model license does not relicense any third-party content. Cinqic does not assert whether weights are adaptations of ShareAlike text; the model card discloses this as an open question."
evidence = ["docs/release/rights_table_2026-10-16.md", "docs/release/NOTICE_draft.md"]

[[release_decision]]
decision_id = "dataset-redistribution-2026-10-16"
resolves = "dataset-redistribution"
status = "DECIDED"
decided_by = "Markus Gillyard (owner directive of 2026-10-16, recorded by Claude Fable 5.1)"
decided_at = "2026-10-16"
public_edition = "Hugging Face dataset CinqicX/juniper1-base-corpus-v0.2.2"
text_payload_sources = ["libretexts", "pressbooks", "oercommons", "python-peps", "wikimedia", "arxiv-papers", "stackexchange"]
text_payload_terms = "each document under its own upstream license (CC BY, CC BY-SA, CC0, public domain, GFDL) with per-row license, license URL, canonical URL, title and authors as the upstream collection provides them; ShareAlike documents stay under CC BY-SA of the same version"
manifest_only_sources = ["stackv2-edu", "finemath-4plus", "fineweb-edu-dedup"]
manifest_only_terms = "document IDs, upstream identifiers and locators, SHA-256 of the stored text, split and byte counts; no text. FineWeb-Edu and FineMath manifests are ODC-By 1.0 derivative databases with the section 4.2 notice; Stack v2 Edu text is withheld because per-file copyright and permission notices cannot be carried with the stored text and 86 license identifiers (72 not on the Blue Oak list as checked) plus 2,300 empty license strings are not resolved"
token_shards = "shards.json and hashes published; token .bin files and document-index parquet withheld (reversible encoding of all ten sources' text)"
held_for_owner = "rights_table_2026-10-16.md Q-1 (FineWeb-Edu/FineMath text as an ODC-By derivative database) and Q-2 (Stack v2 Edu text) stay withheld until the owner decides otherwise; the public edition is complete without them and says so"
evidence = ["docs/release/rights_table_2026-10-16.md", "docs/release/dataset_release_plan_2026-10-16.md"]
