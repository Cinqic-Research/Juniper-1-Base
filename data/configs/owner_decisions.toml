# Explicit owner gates for training use of the Juniper 1 base corpus.
# PENDING means corpus engineering and measurement may be reviewed, but training
# authorization is not established. Only the project owner may change these.
#
# 2026-10-08: Markus Gillyard approved all four [[decision]] records for TRAINING
# INPUT (tokenizer training and pretraining) in a Claude Code session, answering
# a question that stated each source's pinned identity, share of accepted bytes,
# and the evidence brief docs/owner_decision_brief_v0.3.md. The approval does not
# cover redistribution of source text or the license treatment of released
# weights; those are the separate [[release_decision]] records below.

[[decision]]
decision_id = "fineweb-edu-training-use"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["fineweb-edu-dedup"]
question = "For the pinned FineWeb-Edu-derived subset, approve or reject use as Juniper 1 training input after reviewing the ODC-By database grant, Common Crawl Terms of Use (including their AI/ML indemnity), and underlying page rights. Record future weight-distribution treatment separately."

[[decision]]
decision_id = "finemath-training-use"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["finemath-4plus"]
question = "For the pinned FineMath-4+ subset, approve or reject use as Juniper 1 training input after reviewing the ODC-By database grant, Common Crawl Terms of Use (including their AI/ML indemnity), and underlying page rights. Record future weight-distribution treatment separately."

[[decision]]
decision_id = "cc-by-sa-training-and-weights-treatment"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["wikimedia", "stackexchange", "arxiv-papers", "libretexts", "pressbooks", "oercommons"]
question = "For documents carrying CC BY-SA 2.5, 3.0, or 4.0 across the listed sources, choose to exclude them from a new training corpus identity or retain them only after legal review records the training basis, attribution, and treatment of any publicly distributed weights under the intended Apache-2.0 project license. Do not assume the weights are or are not adaptations."

[[decision]]
decision_id = "stackv2-license-and-provenance"
status = "APPROVED"
decided_by = "Markus Gillyard (owner)"
decided_at = "2026-10-08"
scope = "training input only"
sources = ["stackv2-edu"]
question = "For the pinned Common Pile Stack v2 educational release, choose to exclude it or retain it after reviewing repository-level automated license detection, known misclassification risk, Software Heritage principles and opt-outs, the June 2025 release date versus later Stack v2 removals, and whether separate BigCode bulk-access terms apply to this derivative. Record training and distribution treatment separately."

# Release treatment is decided separately from training use and does not gate
# corpus engineering or training. It must be resolved before public weights ship.

[[release_decision]]
decision_id = "weights-release-license-treatment"
status = "PENDING"
question = "Before a public Apache-2.0 weight release, record the treatment of weights trained on FineWeb-Edu and FineMath (ODC-By section 4.3 notice), CC BY-SA documents (ShareAlike and attribution), and Stack v2 code (provenance, opt-outs), with model-card disclosure."

[[release_decision]]
decision_id = "dataset-redistribution"
status = "PENDING"
question = "The training corpus stays private. Any redistribution of corpus text, shards, or derived token IDs needs a source-by-source decision."
