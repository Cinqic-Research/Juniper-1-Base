# SFT v2.1 mixture over the frozen j1-sft-v1.3 build (j1.sft-mix.v1; python -m j1data.sftmix).
# A changed count, group, seed or license list is a new mixture version.
#
# The budget is the unchanged v1.2/v2 recipe: 1,226 updates x 64 episodes = 78,464 draws.
# v1.2 drew each of its 39,234 episodes exactly twice. v2 drew v1.3's 61,806 episodes 1.2695 times
# on average (one epoch plus 261 updates of a second). Groups that regressed in SFT v2 (arithmetic,
# JSON, injection, hierarchy; Python INSUFFICIENT; two chat factual relations) get exactly their
# v1.2 realized draws. Groups that passed (GSM8K, uncertainty) keep their v2 realized draws. The
# remainder goes to v1.3's new material (instruction following including paraphrase and composition,
# formatting, grounded QA, multi-turn): 0.7638 passes, 60% of its v2 exposure.

