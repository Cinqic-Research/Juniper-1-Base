kind = "technical"
options = { excluded_sites = ["es.stackoverflow.com", "pt.stackoverflow.com", "ru.stackoverflow.com", "ja.stackoverflow.com", "meta.stackexchange.com", "meta.stackoverflow.com"], exclude_meta_sites = true }

