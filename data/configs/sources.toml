namespace = "j1.select.v1.stackoverflow"
count = 8

[source.license]
state = "APPROVED_WITH_ATTRIBUTION"
identifiers = ["CC-BY-SA-4.0", "CC-BY-SA-3.0", "CC-BY-SA-2.5"]
evidence = ["https://meta.stackexchange.com/help/licensing", "https://arxiv.org/abs/2506.05209"]
attribution = "Per question: URL, site and author list kept in provenance."
training_use = "PENDING OWNER DECISION: CC BY-SA training use and any later weight-distribution treatment remain unresolved."
redistribution = "Text redistribution requires attribution and CC BY-SA ShareAlike; Cinqic does not redistribute corpus text."
per_document_license_field = "metadata.license"
allowed_document_licenses = ["Creative Commons - Attribution Share-Alike - *"]

