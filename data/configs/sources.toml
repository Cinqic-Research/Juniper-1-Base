[[source]]
source_id = "stackv2-edu"
source_name = "Stack v2 educational code, Blue Oak permissive (Common Pile, filtered)"
family = "code"
description = "Educational-classifier-scored source files from The Stack v2 restricted to repositories whose detected licenses are all Blue Oak Council permissive, with per-file repository, path and license metadata, as packaged by the Common Pile v0.1."
risks = [
  "Permissive licenses require preserving copyright notices on redistribution; repo, path and license are kept in provenance and Cinqic does not redistribute corpus code.",
  "Software Heritage asks LLM builders to honor its LLM principles and opt-outs; recorded for owner review.",
  "The pinned Common Pile release is dated June 2025; public materials reviewed do not establish whether it incorporates later Stack v2 opt-outs or whether the separate BigCode bulk-access agreement applies to this derivative.",
]
known_limitations = ["License detection is repository-level and automated (ScanCode); file-level exceptions can be missed."]

[source.acquisition]
mechanism = "huggingface"
repo = "common-pile/stackv2_edu_filtered"
revision = "c354dbe88469a1153e97c6a63ac50591849654de"
adapter = "dolma_jsonl"
[source.acquisition.files]
# Files are grouped by language (first record of each file inspected 2026-10-07):
# 0000-0017 Markdown, 0018-0019 C, 0020-0027 C++, 0034-0037 Go, 0038-0049 Java,
# 0050-0064 JavaScript, 0073-0084 Python, 0086 Rust, 0087-0088 Shell, 0091-0094 TypeScript.
# C#, PHP, Ruby and Swift files are not acquired in v0.1. Python gets the largest share.
include = [
  "stack-edu-000?.json.gz",
  "stack-edu-001[0-7].json.gz",
  "stack-edu-001[89].json.gz",
  "stack-edu-002[0-7].json.gz",
  "stack-edu-003[4-7].json.gz",
  "stack-edu-003[89].json.gz",
  "stack-edu-004?.json.gz",
  "stack-edu-005?.json.gz",
  "stack-edu-006[0-4].json.gz",
  "stack-edu-007[3-9].json.gz",
  "stack-edu-008[0-4].json.gz",
  "stack-edu-008[78].json.gz",
  "stack-edu-009[1-4].json.gz",
  "stack-edu-0086.json.gz",
]

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-000?.json.gz", "stack-edu-001[0-7].json.gz"]
namespace = "j1.select.v1.markdown"
count = 2

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-001[89].json.gz"]
namespace = "j1.select.v1.c"
count = 1

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-002[0-7].json.gz"]
namespace = "j1.select.v1.cpp"
count = 1

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-003[4-7].json.gz"]
namespace = "j1.select.v1.go"
count = 1

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-003[89].json.gz", "stack-edu-004?.json.gz"]
namespace = "j1.select.v1.java"
count = 1

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-005?.json.gz", "stack-edu-006[0-4].json.gz"]
namespace = "j1.select.v1.javascript"
count = 1

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-007[3-9].json.gz", "stack-edu-008[0-4].json.gz"]
namespace = "j1.select.v1.python"
count = 4

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-008[78].json.gz"]
namespace = "j1.select.v1.shell"
count = 1

[[source.acquisition.files.hash_select]]
patterns = ["stack-edu-009[1-4].json.gz"]
namespace = "j1.select.v1.typescript"
count = 1

[source.license]
state = "APPROVED_WITH_ATTRIBUTION"
identifiers = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unlicense", "0BSD", "Zlib", "other Blue Oak permissive"]
evidence = [
  "https://blueoakcouncil.org/list",
  "https://huggingface.co/datasets/common-pile/stackv2_edu_filtered/tree/c354dbe88469a1153e97c6a63ac50591849654de",
  "https://arxiv.org/abs/2506.05209",
]
attribution = "Per file: repository, path, blob id and detected licenses kept in provenance."
training_use = "PENDING OWNER DECISION: confirm the Common Pile source chain, per-file license detection, Software Heritage terms and opt-outs before training or distribution decisions."
redistribution = "Permitted with license and copyright notices; Cinqic does not redistribute corpus code."
per_document_license_field = "metadata.license_type"
allowed_document_licenses = ["permissive"]

[source.processing]
priority = 25
kind = "code"
# Markdown files are prose with code: judged by the technical-text rules, not code-file rules.
# min_int_score = 3 is the published Stack-Edu cut (SmolLM2, arXiv:2502.02737); this release
# also carries score-2 files, measured at 54-75% of code bytes on 2026-10-07.
options = { text_languages = ["Markdown"], min_int_score = 3 }

