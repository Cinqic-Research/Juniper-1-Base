# Juniper 1 source registry (j1-base v0.1).
#
# Every entry is validated against schemas/source.schema.json. Measured
# quantities (bytes, documents, tokens, rejections) are produced by the
# pipeline into manifests/ and reports/; they are never typed in here.
#
# processing.priority orders duplicate retention: when copies of the same text
# arrive through several sources, the copy from the source with the lowest
# priority number is kept. Explicitly licensed, attributable copies are
# preferred over web-crawled copies.

# ---------------------------------------------------------------- Cinqic ----

[[source]]
source_id = "cinqic-aaa-docs"
source_name = "Cinqic AAA public documentation"
family = "cinqic"
description = "Cinqic-authored Markdown documentation from the public AAA repository, allowlisted by path; evaluation evidence, ledgers, frozen exams and model-identity text are excluded."
risks = [
  "Narrow, self-referential material; kept a small measured component.",
  "Mutable product and model-identity facts are excluded by rule because they belong in post-training or App retrieval.",
]

[source.acquisition]
mechanism = "git"
repo = "Cinqic-Research/AAA"
revision = "439f39bc3ae0109204c8313f4efe47ccb231ae93"
adapter = "cinqic_git"
[source.acquisition.files]
include = ["*.md"]
exclude = [
  "docs/evidence/*", "results/*", "benchmarks/*", "research/*", "tests/*", "*/data/*",
  "docs/issue_ledger.md", "docs/final_audit.md", "CHANGELOG.md", "docs/juniper1/*",
  "*handoff*", "*confirmation*", "*freeze*", "*ledger*", "*audit*", "*review*",
]

[source.license]
state = "APPROVED"
identifiers = ["Apache-2.0"]
evidence = ["https://github.com/Cinqic-Research/AAA/blob/439f39bc3ae0109204c8313f4efe47ccb231ae93/LICENSE"]
attribution = "Cinqic-owned; no third-party attribution."
training_use = "Permitted (Cinqic-owned, Apache-2.0)."
redistribution = "Permitted under Apache-2.0."

[source.processing]
priority = 1
kind = "prose"
options = { deny_terms = ["juniper 1", "juniper lm", "gpt-oss", "juniper reference", "erudition model"] }

