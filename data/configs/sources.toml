  "Underlying pages remain under their authors' copyright; use relies on the ODC-By grant for the compilation, the Common Crawl Terms of Use and the training-use position recorded for owner review.",
  "Common Crawl's Terms of Use include an indemnity covering claims tied to AI/ML use, including training; implications for this use require owner and legal review.",
  "Upstream deduplicates with single-band MinHash only and decontaminates against GSM8K, MATH, MMLU and ARC; Juniper's own global dedup and decontamination are applied again.",
]

