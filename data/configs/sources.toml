[[source]]
source_id = "libretexts"
source_name = "LibreTexts (Common Pile, filtered)"
family = "textbooks"
description = "Open-licensed LibreTexts textbook pages across STEM and other subjects, as packaged by the Common Pile v0.1 with per-page license metadata."
risks = ["Some pages carry heavy LaTeX/MathJax markup.", "Per-page licenses vary; each document's license is checked on ingest."]

[source.acquisition]
mechanism = "huggingface"
repo = "common-pile/libretexts_filtered"
revision = "70388bca52b4a93515e14b1d56618fd7944988fd"
adapter = "dolma_jsonl"
[source.acquisition.files]
include = ["*.json.gz"]

[source.license]
state = "APPROVED_WITH_ATTRIBUTION"
identifiers = ["CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-3.0", "CC-BY-SA-3.0", "CC0-1.0", "Public-Domain"]
evidence = [
  "https://huggingface.co/datasets/common-pile/libretexts_filtered/tree/70388bca52b4a93515e14b1d56618fd7944988fd",
  "https://arxiv.org/abs/2506.05209",
]
attribution = "Per document: author, title, URL and license are kept in provenance (metadata.author/title/url/license)."
training_use = "PENDING OWNER DECISION: included documents may carry CC BY-SA terms; record training and any later weight-distribution treatment before use."
redistribution = "Permitted under each document's license with attribution; ShareAlike documents must stay under CC BY-SA."
per_document_license_field = "metadata.license"
allowed_document_licenses = [
  "Creative Commons - Attribution - *", "Creative Commons - Attribution Share-Alike - *",
  "Creative Commons Zero*", "Creative Commons - Zero*", "Public Domain*", "GNU Free Documentation License*",
]

[source.processing]
priority = 5
# Site chrome measured on 2026-10-07 (lines repeated across thousands of pages);
# only exact whole-line matches are removed, and the count is kept per document.
options = { curated = true, drop_exact_lines = [
  "-", "- Save as PDF", "- Last updated", "Skip to main content", "selected template will load here",
  "This action is not available.",
] }

