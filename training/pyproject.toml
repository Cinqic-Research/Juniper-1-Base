[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Same rule families as Juniper-1-Data.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Expected-behaviour strings are copied verbatim into results.json; one line each keeps them greppable.
"tools/recovery_suite.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["j1bench"]
ignore_missing_imports = true
